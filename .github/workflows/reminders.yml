name: Reminders
# Pings the app hourly. The app decides whether a reminder is due in your
# time zone and sends each one at most once a day.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL or CRON_SECRET not set"; exit 0; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron"
